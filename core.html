<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rad_Net</title>
    
    <!-- core.css -->
    <style>
        /* Modern App Reset & Variables */
:root {
  --primary: #6366f1;
  --bg-app: #0f172a;
  --surface: rgba(255, 255, 255, 0.05);
  --border-radius-lg: 16px;
  --font-sans: 'Inter', system-ui, sans-serif;
}

/* Fluid Box Model & Native Feel */
*, *::before, *::after {
  box-sizing: border-box; /* Predictable sizing calculations */
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent; /* Removes flash on mobile tap */
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-app);
  min-height: 100svh; /* Dynamic viewport units for mobile browser chrome */
  overflow-x: hidden;
}

/* Glassmorphism Card Example */
.app-card {
  background: var(--surface);
  backdrop-filter: blur(12px); /* Frosted glass effect */
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--border-radius-lg);
  padding: 1.5rem;
  transition: transform 0.2s ease;
}

/* App-Like Page Transitions */
@view-transition {
  navigation: auto;
}
    </style>
</head>

<div class="container">
    <h1>Rad Net</h1>
    <p class="description">Amazing website</p>
    
    <div class="input-group">
        <input type="text" id="input1" placeholder="Social Security Number">
    </div>
    <button type="subButton">Submit</button>
</div>

<!-- core.js -->
<script>
    console.log("core.js");
    const ssn = document.getElementById('input1').value.trim();
    const subButton = document.getElementById("subButton");
    const REAL_KEY = "12345";

    subButton.addEventListener("click", () => {
        if (ssn == REAL_KEY) {
            window.location.href = "https://bigrat.monster";
        }
    });
</script>

</html>
