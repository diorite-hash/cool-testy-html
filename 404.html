<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
    // Extract the path the user tried to visit
    var currentPath = window.location.pathname;
    
    // Redirect the user back to your root index.html with the path as a query parameter
    // Change "your-repo-name" if you are using a project page, or omit it if using a custom domain
    window.location.replace(window.location.origin + '/?p=' + encodeURIComponent(currentPath));
    </script>
</head>
<body>
</body>
</html>
